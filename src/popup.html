<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Smooth Orbit</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1b1d21; --muted: #6b7079; --line: #e6e8eb;
    --accent: #e8642c; --track: #d9dce1; --ok: #2f9e5b; --warn: #c98a12; --off: #9aa0a8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17191c; --fg: #eceef1; --muted: #9096a0; --line: #2a2e33; --track: #3a3f46; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 300px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 28px; height: 28px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; flex: 1; }
  header p { margin: 0; font-size: 11px; color: var(--muted); }

  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--track); border-radius: 22px; cursor: pointer; transition: background .15s; }
  .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  main { padding: 12px 16px 4px; }
  .row { margin-bottom: 14px; }
  .row label { display: flex; justify-content: space-between; font-weight: 500; margin-bottom: 6px; }
  .row label output { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
  .row small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  main.disabled .row { opacity: .45; }

  .status { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }

  footer { display: flex; justify-content: space-between; padding: 8px 16px 12px; font-size: 11px; color: var(--muted); }
  footer a { color: var(--muted); }
  button.link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; }
</style>
</head>
<body>
  <header>
    <img src="icons/icon48.png" alt="">
    <div style="flex:1">
      <h1>Smooth Orbit</h1>
      <p>for Onshape</p>
    </div>
    <label class="switch" title="Enable (F8 in Onshape)">
      <input type="checkbox" id="enabled" aria-label="Enable smooth orbit">
      <span></span>
    </label>
  </header>

  <main id="controls">
    <div class="row">
      <label for="tau">Smoothing <output id="tauOut"></output></label>
      <input type="range" id="tau" min="0" max="150" step="5">
      <small>Higher is silkier but trails the mouse more.</small>
    </div>
    <div class="row">
      <label for="gain">Orbit sensitivity <output id="gainOut"></output></label>
      <input type="range" id="gain" min="0.25" max="1.5" step="0.05">
      <small>1.0 is Onshape's default speed.</small>
    </div>
  </main>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Checking...</span></div>

  <footer>
    <button class="link" id="reset">Reset defaults</button>
    <a href="https://saturnfpv.com" target="_blank" rel="noopener">Saturn FPV</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
